# Keep the Render free-plan service awake, so a reviewer's first click does not wait ~22 s
# for a cold start. Render spins a free web service down after 15 minutes with no inbound
# traffic; a ping every 10 minutes keeps it up.
#
# This is a fallback, not the primary keep-warm: GitHub's scheduled runs can start several
# minutes late, or be skipped when GitHub is busy, so a 10-minute schedule can leave gaps
# longer than 15 minutes. An external 5-minute monitor (UptimeRobot or similar) on
# /api/health is the primary; see SUBMISSION_FACTS.md.
#
# Cost: an always-awake free service uses ~720-744 of the 750 free instance hours Render
# grants each WORKSPACE per month, and that pool is shared with every other free web
# service in the workspace. If the pool runs out, Render suspends all of them, this one
# included, until the 1st. So the ping stops on its own after KEEPWARM_UNTIL; move the
# date only after checking the workspace's free usage on the Render billing page.

name: keepwarm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

env:
  KEEPWARM_UNTIL: "2026-11-30"
  HEALTH_URL: "https://servetrace.onrender.com/api/health"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: |
          if [ "$(date -u +%F)" \> "$KEEPWARM_UNTIL" ]; then
            echo "Past KEEPWARM_UNTIL ($KEEPWARM_UNTIL); not pinging."
            exit 0
          fi
          curl -fsS --max-time 60 "$HEALTH_URL"
          echo
