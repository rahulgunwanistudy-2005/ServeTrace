[project]
name = "servetrace"
version = "0.1.0"
description = "Check an affidavit of service against your own location history."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "jinja2>=3.1",
    "weasyprint>=62",
    "openpyxl>=3.1",
    "pillow>=10.4",
]

[project.optional-dependencies]
llm = [
    "google-genai>=0.3",
    "anthropic>=0.39",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    # Draws the one figure in the eval: CONTRADICTED precision and recall against GPS
    # jitter. Dev-only and deliberately so — it is not imported by `app`, it is not in
    # the runtime image, and the product never plots anything.
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["../fixtures/out"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# `eval` and `fixtures` live above this package but are part of this repo, not the world.
known-first-party = ["app", "eval", "fixtures", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pypdfium2.*", "weasyprint.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The fixture generator lives at the repo root, above this package.
pythonpath = [".", ".."]
filterwarnings = ["error::DeprecationWarning:app.*"]
