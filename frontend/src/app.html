<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />
		<meta name="description" content="Check whether a process server's sworn story matches where you really were." />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		%sveltekit.head%
	</head>
	<!-- Colour belongs to the tokens in app.css, which answer to the reader's colour scheme.
	     A utility class here would win against them and pin the page to one scheme. -->
	<body data-sveltekit-preload-data="hover" class="antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
