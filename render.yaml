# Render blueprint. One web service, built from the Dockerfile at the repo root.
# Bible §7: a single deployable — FastAPI serves the built SvelteKit bundle at /.
#
# Nothing here is secret. `sync: false` marks the two values that must be typed into the
# Render dashboard rather than committed, and the service runs fine without either: with
# LLM_PROVIDER=none the affidavit is typed in by hand and every other feature is unchanged.
services:
  - type: web
    name: servetrace
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Extraction is the only place an LLM is used (bible §7). A key on a public URL is
      # a key anybody can spend, so what bounds it is the per-client rate limit below and
      # a spending cap on the Google project. Set LLM_PROVIDER to "none" to turn reading
      # off: the app is fully usable without it, and the affidavit is typed in by hand.
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # Uploads still work — DEMO_ONLY=true would refuse them, and the manual entry form
      # is a fallback rather than the product.
      - key: DEMO_ONLY
        value: false
      - key: MAX_UPLOAD_MB
        value: 15

      # Same-origin only: the bundle and the API are served by this one service, so the
      # browser never makes a cross-origin request and no origin needs allowing.
      - key: CORS_ORIGINS
        value: ""

      # Render terminates TLS and proxies to the container, so every request arrives from
      # the proxy. Without this the rate limiter sees one client for the whole internet
      # and the first busy minute locks everybody out together.
      - key: RATE_LIMIT_TRUSTED_HOPS
        value: 1
      - key: RATE_LIMIT_PER_MINUTE
        value: 30
      - key: RATE_LIMIT_BURST
        value: 10

      - key: GEOSEARCH_URL
        value: https://geosearch.planninglabs.nyc/v2/search

      # --- v1.1 ------------------------------------------------------------------------
      # Real court papers are refused-with-a-notice until Rahul has checked that the
      # provider's plan excludes training on inputs (free tiers may not). The code never
      # decides that; this flag records that a person did.
      - key: LLM_REAL_DATA_ALLOWED
        value: false
      # The reader's own budget: a batch upload calls /api/extract once per file.
      - key: EXTRACT_RATE_LIMIT_PER_MINUTE
        value: 60
      - key: EXTRACT_RATE_LIMIT_BURST
        value: 6
      - key: MAX_EXTRACT_PAGES
        value: 25
      - key: MAX_BATCH_AFFIDAVITS
        value: 2000

      # Day-level counts and the /attorneys contact form. Off until the SQL in
      # infra/supabase/001_v1_1.sql has been applied and both values below are set; with
      # it off the form says it is not switched on and nothing is counted.
      - key: METRICS_ENABLED
        value: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: LEADS_PER_HOUR
        value: 5
